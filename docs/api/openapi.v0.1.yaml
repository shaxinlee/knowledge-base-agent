openapi: 3.1.0
info:
  title: Knowledge Base Agent Assistant API
  version: 0.1.0
  description: v0.1 frontend-backend API contract for the internal Knowledge Base Agent Assistant.
servers:
  - url: http://localhost:8000/api/v1
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: KnowledgeBases
  - name: Files
  - name: Retrieval
  - name: Conversations
  - name: Messages
  - name: Feedback
  - name: AuditLogs
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
  /auth/consumer-users:
    get:
      tags: [Auth]
      security: []
      summary: List selectable consumer users
      description: Returns active user-role accounts for the to C entry page user selector.
      responses:
        "200":
          description: Selectable consumer users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerUserOptionsResponse"
  /auth/consumer-session:
    post:
      tags: [Auth]
      security: []
      summary: Create a passwordless consumer user session
      description: Creates a passwordless session for the selected active user-role account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerSessionRequest"
      responses:
        "200":
          description: Consumer session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refreshed token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /assistant-profile:
    get:
      tags: [Assistant Profile]
      summary: Get assistant profile
      responses:
        "200":
          description: Assistant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProfile"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Assistant Profile]
      summary: Update assistant profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantProfile"
      responses:
        "200":
          description: Updated assistant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProfile"
        "403":
          $ref: "#/components/responses/Error"
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
  /users/{user_id}:
    patch:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /users/{user_id}/disable:
    post:
      tags: [Users]
      summary: Disable user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{user_id}/enable:
    post:
      tags: [Users]
      summary: Enable user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Enabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{user_id}/reset-password:
    post:
      tags: [Users]
      summary: Reset user password
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
  /knowledge-bases:
    get:
      tags: [KnowledgeBases]
      summary: List knowledge bases
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeBaseStatus"
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseListResponse"
    post:
      tags: [KnowledgeBases]
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseCreateRequest"
      responses:
        "201":
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
  /knowledge-bases/{kb_id}:
    get:
      tags: [KnowledgeBases]
      summary: Get knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    patch:
      tags: [KnowledgeBases]
      summary: Update knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseUpdateRequest"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    delete:
      tags: [KnowledgeBases]
      summary: Soft delete knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "204":
          description: Deleted
  /knowledge-bases/{kb_id}/files:
    get:
      tags: [Files]
      summary: List files in knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FileStatus"
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
  /knowledge-bases/{kb_id}/files/upload:
    post:
      tags: [Files]
      summary: Upload files to knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    format: binary
                force:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Files accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /files/{file_id}:
    get:
      tags: [Files]
      summary: Get file
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
    delete:
      tags: [Files]
      summary: Soft delete file
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: Deleted
  /files/{file_id}/status:
    get:
      tags: [Files]
      summary: Get file parse/index status
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStatusResponse"
  /files/{file_id}/summary:
    get:
      tags: [Files]
      summary: Get current document summary
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Document summary and chunk extraction progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
  /files/{file_id}/summary/retry:
    post:
      tags: [Files]
      summary: Retry or rebuild current document summary
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Summary task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
  /files/{file_id}/retry-parse:
    post:
      tags: [Files]
      summary: Retry file parse
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "202":
          description: Retry job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseJob"
  /files/{file_id}/chunks:
    get:
      tags: [Files]
      summary: List chunks for file
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Chunk list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkListResponse"
  /knowledge-graph:
    get:
      tags: [KnowledgeGraph]
      summary: Get document summary relationship graph
      parameters:
        - name: knowledge_base_id
          in: query
          schema:
            type: string
        - name: include_cross_knowledge_base
          in: query
          schema:
            type: boolean
            default: true
        - name: min_similarity
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.45
      responses:
        "200":
          description: Knowledge graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"
  /knowledge-graph/refresh:
    post:
      tags: [KnowledgeGraph]
      summary: Rebuild document relationships and community summaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force_embeddings:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Rebuild requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"
  /knowledge-bases/{knowledge_base_id}/community-summary:
    get:
      tags: [KnowledgeGraph]
      summary: Get knowledge-base community summary
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Community summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySummary"
  /knowledge-bases/{knowledge_base_id}/retrieval/search:
    post:
      tags: [Retrieval]
      summary: Search chunks within one knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalSearchRequest"
      responses:
        "200":
          description: Retrieval results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalSearchResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations for knowledge base
      parameters:
        - name: knowledge_base_id
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
    post:
      tags: [Conversations]
      summary: Create conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreateRequest"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversation_id}:
    get:
      tags: [Conversations]
      summary: Get conversation with messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
    delete:
      tags: [Conversations]
      summary: Delete conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Deleted
  /conversations/{conversation_id}/messages:
    post:
      tags: [Messages]
      summary: Send message and receive SSE answer
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreateRequest"
      responses:
        "200":
          description: JSON response when stream=false, or text/event-stream when stream=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCreateResponse"
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: SSE message stream
                  value: |
                    event: message_created
                    data: {"user_message":{"id":"msg_user","conversation_id":"conv_xxx","role":"user","content":"question","created_at":"2026-06-06T02:30:10Z","citations":[],"feedback_rating":null},"assistant_message":{"id":"msg_assistant","conversation_id":"conv_xxx","role":"assistant","content":"","created_at":"2026-06-06T02:30:11Z","citations":[],"feedback_rating":null}}

                    event: retrieval
                    data: {"retrieved_count":0,"reranked_count":0,"final_context_count":0}

                    event: token
                    data: {"text":"当前知识库中没有找到足够依据回答该问题。"}

                    event: done
                    data: {"message_id":"msg_assistant","answer":"当前知识库中没有找到足够依据回答该问题。","citations":[]}
  /messages/{message_id}/feedback:
    post:
      tags: [Feedback]
      summary: Create or update feedback for assistant message
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreateRequest"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: List audit logs
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: actor_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    KnowledgeBaseId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ISODateTime:
      type: string
      format: date-time
    UserRole:
      type: string
      enum: [admin, user]
    KnowledgeBaseStatus:
      type: string
      enum: [active, deleting, deleted]
    FileStatus:
      type: string
      enum: [uploaded, queued, processing, indexed, partially_indexed, failed, deleting, deleted]
    ParseJobStatus:
      type: string
      enum: [queued, parsing, normalizing, chunking, embedding, indexing, indexed, partially_indexed, failed, cancelled]
    MessageRole:
      type: string
      enum: [user, assistant, system]
    FeedbackRating:
      type: string
      enum: [helpful, unhelpful]
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend-api
        version:
          type: string
          example: 0.1.0
    ErrorEnvelope:
      type: object
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ConsumerSessionRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
    ConsumerUserOption:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
    ConsumerUserOptionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerUserOption"
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 1800
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/User"
    AssistantProfile:
      type: object
      required:
        - name
        - identity_answer
        - capability_answer
        - greeting_answer
        - thanks_answer
        - usage_answer
        - handoff_answer
        - fallback_casual_answer
      properties:
        name:
          type: string
        identity_answer:
          type: string
        capability_answer:
          type: string
        greeting_answer:
          type: string
        thanks_answer:
          type: string
        usage_answer:
          type: string
        handoff_answer:
          type: string
        fallback_casual_answer:
          type: string
    User:
      type: object
      required: [id, username, display_name, role, is_active, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        last_login_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
    UserCreateRequest:
      type: object
      required: [email, username, display_name, password, role]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        display_name:
          type: string
        password:
          type: string
          format: password
        role:
          $ref: "#/components/schemas/UserRole"
    UserUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
    ResetPasswordResponse:
      type: object
      required: [user_id, reset_at]
      properties:
        user_id:
          type: string
        reset_at:
          $ref: "#/components/schemas/ISODateTime"
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedResponse"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
    PaginatedResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    KnowledgeBase:
