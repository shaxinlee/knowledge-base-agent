[project]
name = "knowledge-base-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the Knowledge Base Agent Assistant."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "minio>=7.2.0,<8.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
